spring:
  application:
    name: amazon-api-users-integration
  config:
    import: vault://kv/amazon-api/security
  cloud:
    vault:
      enabled: true
      # URI and token are dynamically set by TestcontainersConfiguration
      uri: ${VAULT_ADDR:http://localhost:8200}
      token: ${VAULT_TOKEN:myroot}
      kv:
        enabled: true
        backend: kv
      fail-fast: false
      connection-timeout: 10000
      read-timeout: 10000
    compatibility-verifier:
      enabled: false
  datasource:
    # Datasource properties are automatically configured by @ServiceConnection
    # from MySQLContainer in TestcontainersConfiguration
    url: ${spring.datasource.url:jdbc:mysql://localhost:3306/amazon_users_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${spring.datasource.username:test}
    password: ${spring.datasource.password:test}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false

# Vault secret should provide password_pepper
# If not available, tests will fail with meaningful error

logging:
  level:
    root: INFO
    com.huerta.amazonapi.users: DEBUG
    org.springframework.vault: DEBUG
