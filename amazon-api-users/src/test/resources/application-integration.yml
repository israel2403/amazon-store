spring:
  application:
    name: amazon-api-users-integration
  config:
    import: optional:vault://  # Disable Vault import for Testcontainers tests
  cloud:
    vault:
      enabled: false  # Disabled for Testcontainers - pepper provided directly
    compatibility-verifier:
      enabled: false
  datasource:
    # Datasource properties are dynamically configured by @DynamicPropertySource
    # from MySQLContainer in TestcontainersConfiguration
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false

# Password pepper for integration tests (bypasses Vault)
password_pepper: testcontainers-pepper-value-for-integration-tests

logging:
  level:
    root: INFO
    com.huerta.amazonapi.users: DEBUG
    org.springframework.vault: DEBUG
