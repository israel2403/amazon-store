# Base configuration - extended by profile-specific files
# Active profile is set via SPRING_PROFILES_ACTIVE environment variable

spring:
  application:
    name: amazon-api-users

server:
  port: 8081

# Common configuration across all profiles
management:
  endpoints:
    web:
      base-path: /actuator

security:
  password:
    # Resolved from Vault-provided environment variable in Kubernetes (e.g. PASSWORD_PEPPER).
    pepper: ${PASSWORD_PEPPER:}
    argon2:
      memory-kb: 65536 # 64 MB
      iterations: 3
      parallelism: 1
      salt-length: 16
      hash-length: 32
